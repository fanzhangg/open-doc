<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src ws: wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
  <title>opendoc</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <aside class="od-files" aria-label="Files in this folder" hidden>
    <div class="od-files-head">
      <span class="od-files-icon" data-icon="folder"></span>
      <span class="od-files-name"></span>
    </div>
    <ul class="od-files-tree" role="tree" aria-label="Files"></ul>
    <label class="od-files-find"><span aria-hidden="true">/</span><input class="od-files-filter" type="text" placeholder="Filter by regex" aria-label="Filter files by regular expression" spellcheck="false" autocomplete="off"></label>
    <div class="od-files-resize"></div>
  </aside>

  <header class="od-header">
    <button class="od-icon-btn od-files-toggle" type="button" data-icon="sidebar" data-tip="Hide files" aria-label="Files in this folder" aria-pressed="true" hidden></button>
    <div class="od-title">
      <span class="od-doc-icon" data-icon="file"></span>
      <span class="od-doc-name"></span>
      <span class="od-preview-name"></span>
      <span class="od-status" role="status" aria-live="polite" hidden>
        <span class="od-status-icon"></span><span class="od-status-text"></span>
      </span>
    </div>
    <span class="od-spacer"></span>
    <div class="od-people">
      <button class="od-me" type="button" title="You"></button>
      <div class="od-agents" aria-label="Buddies in this doc"></div>
      <button class="od-invite" type="button" data-icon="users" data-tip="Buddies in this doc" aria-label="Buddies" aria-haspopup="dialog"></button>
    </div>
    <button class="od-icon-btn od-settings-toggle" type="button" data-icon="settings" data-tip="Settings" data-keys="Mod+," aria-label="Settings" aria-haspopup="dialog"></button>
  </header>

  <div class="od-panel" role="dialog" aria-label="Profile" hidden></div>

  <div class="od-toolbar" role="toolbar" aria-label="Formatting">
    <span class="od-spacer"></span>
    <button type="button" class="od-pill od-tool-comment" data-action="comments" data-icon="comment" aria-pressed="true" aria-label="Comments" data-tip="Hide comments"><span class="od-comment-count"></span></button>
    <button type="button" class="od-pill od-show-resolved" data-icon="checkCircle" aria-pressed="false" aria-label="Resolved comments" data-tip="Show resolved comments"></button>
    <button type="button" class="od-pill od-tool-history" data-icon="history" aria-pressed="false" aria-label="Version history" data-tip="Version history" data-keys="Mod+Alt+Shift+H"></button>
  </div>

  <div class="od-history-bar" role="toolbar" aria-label="Version history">
    <button type="button" class="od-back" data-action="close" data-icon="back" data-tip="Back to editing" data-keys="Escape">Back</button>
    <span class="od-history-heading" role="status" aria-live="polite"></span>
    <span class="od-spacer"></span>
    <label class="od-history-changes"><input type="checkbox" checked> Show changes</label>
    <button type="button" class="od-primary od-history-restore" data-action="restore" hidden>Restore this version</button>
  </div>

  <div class="od-banner od-notice" hidden>
    <span class="od-banner-icon" data-icon="alert"></span>
    <span class="od-banner-text"></span>
    <button type="button" data-action="any-size" hidden></button>
  </div>
  <div class="od-banner od-read-only" hidden>
    <span class="od-banner-icon" data-icon="alert"></span>
    <span class="od-banner-text"></span>
    <button type="button" data-action="update">Get the update</button>
    <button type="button" data-action="start-over">Start new comments</button>
    <button type="button" data-action="reveal"></button>
  </div>
  <div class="od-banner od-missing" hidden>
    <span class="od-banner-icon" data-icon="alert"></span>
    <span class="od-banner-text"></span>
    <button type="button" data-action="recreate">Save it here again</button>
  </div>

  <main class="od-canvas">
    <div class="od-stage">
      <article class="od-page" aria-label="Document">
        <div class="od-editor"></div>
      </article>
      <aside class="od-margin" aria-label="Comments"></aside>
    </div>
    <div class="od-preview" aria-label="File, read only"></div>
    <div class="od-stage od-history-stage">
      <article class="od-page" aria-label="Earlier version of the document">
        <div class="od-editor"></div>
      </article>
      <aside class="od-history" aria-label="Versions">
        <ol class="od-history-list" role="listbox" aria-label="Versions" tabindex="0"></ol>
      </aside>
    </div>
  </main>

  <div class="od-tip" role="tooltip" hidden></div>

</body>
</html>
