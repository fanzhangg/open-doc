# Installers for the Ponjo desktop app (docs/architecture.md, Desktop app).
# Build with `npm run dist:desktop`; output goes to release/.

appId: app.ponjo.desktop
productName: Ponjo
copyright: Copyright © 2026 fanzhangg
directories:
  output: release
  buildResources: build

# The npm package's entry is the core library; the app starts here.
extraMetadata:
  main: desktop/main.js

files:
  - package.json
  - desktop/**
  - src/**
  - agents/**
  - dist/web/**
  - build/icon.png
  - build/icon.svg
  - build/document.ico

# No asar archive: the shipped agent scripts are copied from agents/.
asar: false

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

# On Windows, build/installer.nsh registers Ponjo as an app that can open
# .md files, without making it the default. macOS and Linux declare the types.
mac:
  target: dmg
  category: public.app-category.productivity
  # A full tile, not a bare mark: macOS 26 puts a bare mark on a grey plate.
  icon: build/icon.icns
  # Ad-hoc signature for local and pull request builds; CI signs and notarizes
  # main with the Developer ID (.github/workflows/desktop.yml). Without any
  # signature the bundle's signature is broken and shows as "damaged".
  identity: "-"
  hardenedRuntime: false
  # Chromium's own UI strings; the other locales add about 48 MB.
  electronLanguages: [en, zh_CN]
  fileAssociations: &markdown
    - ext: [md, markdown]
      name: Markdown Document
      role: Editor
      icon: document # build/document.icns; Linux has no document icons

linux:
  target: AppImage
  category: Office
  icon: build/icon.png
  fileAssociations: *markdown
