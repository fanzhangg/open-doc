# Installers for the OpenDoc desktop app (docs/architecture.md, Desktop app).
# Build with `npm run dist:desktop`; output goes to release/.

appId: dev.opendoc.desktop
productName: OpenDoc
copyright: Copyright © 2026 fanzhangg
directories:
  output: release
  buildResources: build

# The npm package's entry is the core library; the app starts here.
extraMetadata:
  main: desktop/main.js

files:
  - package.json
  - desktop/**
  - bin/**
  - src/**
  - agents/**
  - dist/web/**
  - build/icon.png
  - build/icon.svg
  - build/document.ico

# No asar archive: the shipped agent scripts are copied from agents/, and
# the bundled CLI (`opendoc`) runs from these files directly.
asar: false

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

# On Windows, build/installer.nsh registers OpenDoc as an app that can open
# .md files, without making it the default. macOS and Linux declare the types.
mac:
  target: dmg
  category: public.app-category.productivity
  icon: build/icon.png
  # Ad-hoc signature until there is a Developer ID. Without one the bundle's
  # signature is broken, and a downloaded copy shows as "damaged".
  identity: "-"
  hardenedRuntime: false
  fileAssociations: &markdown
    - ext: [md, markdown]
      name: Markdown Document
      role: Editor

linux:
  target: AppImage
  category: Office
  icon: build/icon.png
  fileAssociations: *markdown
