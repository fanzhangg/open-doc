# The relay and the teammate's page (docs/architecture.md, Sharing), at
# https://share.ponjo.app. Deploy from here with `npm run deploy`, which
# builds the page first (README.md, Deploying the relay).
# The tests run it locally with wrangler (test/relay/harness.js).
name = "ponjo"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = false
routes = [{ pattern = "share.ponjo.app", custom_domain = true }]

# The teammate's page, team.html, and what it loads (scripts/build.js).
[assets]
directory = "../dist/web"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Hosts an address connects a minute (worker.js).
[[ratelimits]]
name = "HOSTS"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Pages an address opens a minute (worker.js): a page connects again after
# its line drops, and once per doc it opens.
[[ratelimits]]
name = "PAGES"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
