<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>OpenDoc</title>
  <!-- The editor's look: its tokens, theme, buttons, tooltips and Settings. -->
  <link rel="stylesheet" href="../dist/web/app.css">
  <style>
    body { user-select: none; }
    .od-start { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 20px 16px; }
    .od-start h2 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-faint); }

    /* the one way in: the OS dialog opens a folder, or makes a new one */
    .od-start-open { display: flex; align-items: center; gap: 6px; height: 28px; margin-left: 4px; padding: 0 12px 0 10px; border: 0; border-radius: 6px; background: var(--text); color: var(--on-text); font-size: 13px; font-weight: 500; }
    .od-start-open:hover { background: color-mix(in srgb, var(--text) 86%, var(--canvas)); }
    .od-start-open [data-icon] { display: flex; }
    .od-start-open .od-icon { width: 16px; height: 16px; }

    /* recent projects: rows like the docs sidebar's */
    .od-recent { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .od-recent ul { list-style: none; margin: 0 -8px; padding: 0; overflow-y: auto; }
    .od-recent li button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 13px; }
    .od-recent li button:hover { background: var(--hover); }
    .od-recent li .od-icon { width: 16px; height: 16px; color: var(--text-faint); }
    .od-recent-name { flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .od-recent-folder { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: right; color: var(--text-faint); font-size: 12px; }
    .od-recent-empty { margin: 0; padding: 4px 0; color: var(--text-faint); font-size: 13px; }
  </style>
  <script src="../dist/web/start.js" defer></script>
</head>
<body>
  <header class="od-header">
    <button class="od-start-open" type="button" data-action="open-project" data-tip="A folder you have, or a new one made in the dialog" data-keys="Mod+Shift+O">
      <span data-icon="folder"></span>Open Project…
    </button>
    <span class="od-spacer"></span>
    <button class="od-icon-btn od-settings-toggle" type="button" data-icon="settings" data-tip="Settings" data-keys="Mod+," aria-label="Settings" aria-haspopup="dialog"></button>
  </header>

  <main class="od-start">

    <section class="od-recent" aria-labelledby="recent-title">
      <h2 id="recent-title">Recent</h2>
      <ul></ul>
      <p class="od-recent-empty" hidden>Projects you open show up here</p>
    </section>
  </main>

  <div class="od-tip" role="tooltip" hidden></div>
</body>
</html>
