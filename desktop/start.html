<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>OpenDoc</title>
  <!-- The editor's look: its tokens, theme, buttons, tooltips and Settings. -->
  <link rel="stylesheet" href="../dist/web/app.css">
  <style>
    /* app.css finds Inter on the doc's server; here it is a file. Declared after, so these win. */
    @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(../dist/web/fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); }
    @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(../dist/web/fonts/inter-latin-ext-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0100-02BA, U+1E00-1EFF; }

    body { user-select: none; }
    .od-header { padding-left: 32px; }
    .od-start-actions { display: flex; gap: 8px; }
    .od-start { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 28px; padding: 16px 32px 24px; font-size: 13px; }
    .od-start h2 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); }

    /* recent docs: rows like the People panel's */
    .od-recent { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .od-recent ul { list-style: none; margin: 0 -8px; padding: 0; overflow-y: auto; }
    .od-recent li button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
    .od-recent li button:hover { background: var(--hover); }
    .od-recent li .od-icon { width: 16px; height: 16px; flex: none; color: var(--text-faint); }
    .od-recent-name { flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .od-recent-folder { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; color: var(--text-faint); font-size: 12.5px; }
    .od-recent-empty { margin: 0; color: var(--text-faint); }
  </style>
  <script src="../dist/web/start.js" defer></script>
</head>
<body>
  <header class="od-header">
    <div class="od-start-actions">
      <button class="od-primary" type="button" data-action="new" data-tip="New doc" data-keys="Mod+N">New doc</button>
      <button class="od-secondary" type="button" data-action="open" data-tip="Open a doc" data-keys="Mod+O">Open…</button>
      <button class="od-secondary" type="button" data-action="open-folder" data-tip="Open a folder of docs" data-keys="Mod+Shift+O">Open Folder…</button>
    </div>
    <span class="od-spacer"></span>
    <button class="od-icon-btn od-settings-toggle" type="button" data-icon="settings" data-tip="Settings" data-keys="Mod+," aria-label="Settings" aria-haspopup="dialog"></button>
  </header>

  <main class="od-start">
    <section class="od-recent" aria-labelledby="recent-title">
      <h2 id="recent-title">Recent</h2>
      <ul></ul>
      <p class="od-recent-empty" hidden>No recent docs</p>
    </section>
  </main>

  <div class="od-tip" role="tooltip" hidden></div>
</body>
</html>
