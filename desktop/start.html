<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'">
  <title>OpenDoc</title>
  <style>
    /* The editor's look (web/app.css): Inter, its tokens, pill buttons, rows. */
    @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(../dist/web/fonts/inter-latin-wght-normal.woff2) format("woff2-variations"); }
    @font-face { font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(../dist/web/fonts/inter-latin-ext-wght-normal.woff2) format("woff2-variations"); unicode-range: U+0100-02BA, U+1E00-1EFF; }
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --hover: rgba(55, 53, 47, 0.07);
      --text: #2f2e2b; --text-soft: rgba(47, 46, 43, 0.64); --text-faint: rgba(47, 46, 43, 0.4);
      --border-strong: rgba(55, 53, 47, 0.22);
      --accent: #2563eb; --accent-soft: rgba(37, 99, 235, 0.1); --on-accent: #ffffff;
      --danger: #d93025; --brand: #1d9e75;
      --ui-font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202020; --hover: rgba(255, 255, 255, 0.07);
        --text: rgba(255, 255, 255, 0.86); --text-soft: rgba(255, 255, 255, 0.56); --text-faint: rgba(255, 255, 255, 0.36);
        --border-strong: rgba(255, 255, 255, 0.16);
        --accent: #7aa7ff; --accent-soft: rgba(122, 167, 255, 0.14); --on-accent: #0b1a33;
        --danger: #f28b82; --brand: #2bc08f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.45 var(--ui-font); letter-spacing: -0.003em;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; gap: 28px; padding: 32px 32px 24px;
      user-select: none; -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* the logo: a padlock left open, and an O that never closes */
    h1 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
    .mark { width: 22px; height: 30px; flex: none; }
    .mark .shackle, .word .o path { fill: none; stroke: var(--brand); stroke-linecap: round; }
    .mark .body { fill: var(--text); }
    .mark .lines { stroke: var(--bg); stroke-width: 3; stroke-linecap: round; }
    .word .o { width: 0.9em; height: 0.9em; margin-right: 0.03em; vertical-align: -0.05em; }

    .actions { display: flex; gap: 8px; }
    .primary, .secondary { border-radius: 18px; padding: 6px 18px; font-size: 13px; font-weight: 500; }
    .primary { border: 0; background: var(--accent); color: var(--on-accent); }
    .primary:hover { filter: brightness(1.08); }
    .secondary { border: 1px solid var(--border-strong); background: var(--bg); color: var(--accent); }
    .secondary:hover { background: var(--accent-soft); }

    h2 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-faint); }

    /* the crew: faces like the editor's header, greyed out when not in it */
    .crew-list { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 -6px; }
    .member { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border: 0; border-radius: 8px; background: none; }
    .member:hover { background: var(--hover); }
    .member .face { width: 36px; height: 36px; }
    .member[aria-pressed="false"] .face { filter: grayscale(1); opacity: 0.45; }
    .member[aria-pressed="false"] .member-name { color: var(--text-faint); }
    .member-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text-soft); }
    .od-face { display: block; width: 100%; height: 100%; overflow: visible; }
    .add-face { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 1px dashed var(--border-strong); border-radius: 50%; color: var(--text-soft); }
    .add-face svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
    .member input { width: 60px; padding: 0 4px; border: 0; border-radius: 4px; background: var(--hover); color: var(--text); font: inherit; font-size: 12px; text-align: center; outline: 1px solid var(--accent); }
    .member input[aria-invalid="true"] { outline-color: var(--danger); }

    /* recent docs: rows like the People panel's */
    .recent { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    ul { list-style: none; margin: 0 -8px; padding: 0; overflow-y: auto; }
    li button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 4px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
    li button:hover { background: var(--hover); }
    li svg { width: 16px; height: 16px; flex: none; fill: none; stroke: var(--text-faint); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .name { flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .folder { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; color: var(--text-faint); font-size: 12.5px; }
    .empty { margin: 0; color: var(--text-faint); }
  </style>
  <script src="../dist/web/start.js" defer></script>
</head>
<body>
  <h1 aria-label="OpenDoc">
    <svg class="mark" viewBox="10 8 52 70" aria-hidden="true">
      <path class="shackle" d="M22 40V26a14 14 0 0 1 28 0v6" stroke-width="5"/>
      <rect class="body" x="14" y="40" width="44" height="34" rx="5"/>
      <path class="lines" d="M22 50h28M22 58h28M22 66h18"/>
    </svg>
    <span class="word" aria-hidden="true"><svg class="o" viewBox="0 0 32 32"><path d="M28 16a12 12 0 1 1-6-10.39" stroke-width="4.5"/></svg>penDoc</span>
  </h1>
  <div class="actions">
    <button class="primary" type="button" data-action="new">New doc</button>
    <button class="secondary" type="button" data-action="open">Open…</button>
  </div>
  <section aria-labelledby="crew-title">
    <h2 id="crew-title">Crew</h2>
    <div class="crew-list" role="group" aria-labelledby="crew-title"></div>
  </section>
  <section class="recent" aria-labelledby="recent-title">
    <h2 id="recent-title">Recent</h2>
    <ul></ul>
    <p class="empty" hidden>No recent docs</p>
  </section>
</body>
</html>
