<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Ponjo</title>
  <!-- The app's look, this window's own rules included (the home window section). -->
  <link rel="stylesheet" href="../dist/web/app.css">
  <script src="../dist/web/start.js" defer></script>
</head>
<body class="pj-home">
  <main class="pj-start">
    <button class="pj-start-open" type="button" data-action="open-project" data-tip="A folder you have, or a new one made in the dialog" data-keys="Mod+Shift+O">
      <span data-icon="plus"></span>Open Project…
    </button>

    <section class="pj-recent" aria-label="Recent">
      <ul></ul>
      <p class="pj-recent-empty" hidden>Projects you open show up here</p>
    </section>
  </main>

  <div class="pj-tip" role="tooltip" hidden></div>
</body>
</html>
