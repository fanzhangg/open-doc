# The download page (gh-pages) shows the app icon. When it changes on main,
# copy it there: build/icon.svg as icon.svg, build/icon.png as icon.png and
# favicon.png. Run it by hand to catch up.

name: Download page icons

on:
  push:
    branches: [main]
    paths: [build/icon.svg, build/icon.png]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Copy the icons, and push if they changed
        working-directory: pages
        run: |
          cp ../main/build/icon.svg icon.svg
          cp ../main/build/icon.png icon.png
          cp ../main/build/icon.png favicon.png
          git add icon.svg icon.png favicon.png
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Icons from main @ ${GITHUB_SHA::7}"
          git push
