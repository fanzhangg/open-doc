# Checks every pull request and push to main on Windows and macOS: lint, the
# tests, then the installers, and a smoke test that opens a doc in the
# packaged app. Pushes to main that pass all of it replace the "nightly"
# pre-release (https://github.com/fanzhangg/open-doc/releases/tag/nightly),
# so a broken build never replaces a working one.

name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
            app: release/mac-arm64/OpenDoc.app/Contents/MacOS/OpenDoc
          - os: windows-latest
            args: --win --x64
            app: release/win-unpacked/OpenDoc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
        timeout-minutes: 15
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Smoke test the packaged app
        run: node scripts/smoke-desktop.js ${{ matrix.app }}
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: opendoc-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (main @ ${GITHUB_SHA::7})" \
            --notes "Built from main at $GITHUB_SHA. The macOS app is ad-hoc signed: on first open, right-click it and choose Open."
