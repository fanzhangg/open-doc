# Checks every pull request and push to main. The gate, on Windows and macOS:
# lint, the installers, and a smoke test that opens a doc in the packaged
# app. Pushes to main that pass it replace the "nightly" pre-release
# (https://github.com/fanzhangg/open-doc/releases/tag/nightly), so a build
# that cannot open a doc never replaces a working one. The unit tests run
# once, on Linux, and report without holding back the nightly.

name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # "package (windows)" and "package (macos)" are the checks main's ruleset
    # requires: rename them there too if they change.
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            args: --mac --arm64 --x64
            app: release/mac-arm64/OpenDoc.app/Contents/MacOS/OpenDoc
          - platform: windows
            os: windows-latest
            args: --win --x64
            app: release/win-unpacked/OpenDoc.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Smoke test the packaged app
        run: node scripts/smoke-desktop.js ${{ matrix.app }}
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        with:
          name: opendoc-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  release:
    needs: build # not test: failing unit tests show on the PR but do not hold back the nightly
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly out/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (main @ ${GITHUB_SHA::7})" \
            --notes "Built from main at $GITHUB_SHA. The macOS app is ad-hoc signed: on first open, right-click it and choose Open."
