# The site (gh-pages): the download page shows the app icon, and /design/ is
# the design system, rendered with the app's own stylesheet. When either
# changes on main, copy it there. Run it by hand to catch up.

name: Pages

on:
  push:
    branches: [main]
    paths: [build/icon.svg, build/icon.png, docs/design.html, web/app.css]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the stylesheet and fonts
        working-directory: main
        run: npm ci && npm run build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - name: Copy, and push if anything changed
        working-directory: pages
        run: |
          cp ../main/build/icon.svg icon.svg
          cp ../main/build/icon.png icon.png
          cp ../main/build/icon.png favicon.png
          mkdir -p design dist/web/fonts
          cp ../main/docs/design.html design/index.html
          cp ../main/dist/web/app.css dist/web/app.css
          cp ../main/dist/web/fonts/* dist/web/fonts/
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Site from main @ ${GITHUB_SHA::7}"
          git push
